spring.application.name=fitness-tracker-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fitness_tracker}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (HS256): secret must be at least 32 bytes.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# USDA FoodData Central (https://fdc.nal.usda.gov/api-guide.html). Key from env only.
usda.api.base-url=${USDA_API_BASE_URL:https://api.nal.usda.gov/fdc/v1}
usda.api.key=${USDA_API_KEY:}

# Cache food search/detail lookups to respect USDA rate limits.
spring.cache.type=caffeine
spring.cache.cache-names=foodSearch,foodDetail
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=6h

# AI coaching (Google Gemini by default). Key from env only; never logged.
app.ai.provider=${AI_PROVIDER:gemini}
app.ai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.ai.model=${AI_MODEL:gemini-2.0-flash}
app.ai.api-key=${AI_API_KEY:}
