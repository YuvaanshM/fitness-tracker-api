spring.datasource.url=jdbc:h2:mem:fitness_tracker_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=dev-only-change-this-to-a-long-random-secret-key-32b
app.jwt.expiration-ms=86400000

# USDA client is mocked in tests; blank key and default base URL keep the context valid.
usda.api.base-url=https://api.nal.usda.gov/fdc/v1
usda.api.key=

# AI client bean can load; tests mock AiClient and never call the live provider.
app.ai.provider=gemini
app.ai.base-url=https://generativelanguage.googleapis.com/v1beta
app.ai.model=gemini-2.0-flash
app.ai.api-key=
